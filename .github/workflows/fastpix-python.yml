name: Publish Python distribution to PyPI

on:
  push:
    tags:
      - 'v*.*.*'              # Fires when a tag is pushed via `git push`
  release:
    types: [published]        # Fires when a release is published via the GitHub web UI
  workflow_dispatch:          # Adds a "Run workflow" button on the Actions tab
    inputs:
      ref:
        description: 'Tag or branch to publish from (e.g. v1.1.3)'
        required: false
        default: ''

# Least-privilege token: only read access is needed (checkout + build).
# Publishing authenticates to PyPI with its own API token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_dispatch with a user-supplied ref, check that out;
          # otherwise fall back to the default ref the event was fired against.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build tools
        # Pin exact versions so publishes are reproducible (locked dependencies).
        run: python -m pip install build==1.5.0 twine==6.2.0

      - name: Build package
        run: python -m build

      - name: Verify the built wheel imports before publishing (pre-publish guard)
        # Blocks the publish if the freshly-built artifact cannot import — the
        # exact 1.1.3/1.1.4 failure mode. Supply-chain clean: installs only
        # pinned runtime deps and *extracts* the wheel (no `pip install` of an
        # unpinned package), then imports every module on the runner.
        run: |
          python -m pip install "httpcore==1.0.9" "httpx==0.28.1" "pydantic==2.13.4"
          python -m zipfile -e dist/*.whl wheel_check
          cd wheel_check
          python - <<'PY'
          import importlib, pkgutil, sys
          import fastpix_python as root
          failed = []
          for mi in pkgutil.walk_packages(root.__path__, root.__name__ + '.'):
              try:
                  importlib.import_module(mi.name)
              except Exception as e:  # noqa: BLE001 - report every failure
                  failed.append(f"{mi.name}: {type(e).__name__}: {e}")
          if failed:
              print("Pre-publish import check FAILED:")
              for item in failed:
                  print("  -", item)
              sys.exit(1)
          print("Pre-publish import check passed.")
          PY

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        # `--skip-existing` makes the upload idempotent — re-running for the
        # same version won't fail if it's already on PyPI. Useful when both
        # `push: tags` and `release: published` fire for the same tag.
        run: twine upload --skip-existing dist/*