name: Import smoke test

# Guards against shipping code that fails to import on a supported Python.
# This is exactly the class of bug that broke 1.1.3/1.1.4: `playback.py` used
# `List` without importing it, which only crashes on Python < 3.14 (eager
# annotation evaluation). Importing every module on the floor (3.9) and mid
# versions (3.12/3.13) catches it before it can be released.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege token: this workflow only reads the repo to import it.
permissions:
  contents: read

jobs:
  import-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned runtime dependencies
        # Locked versions (no version ranges) so the check is reproducible and
        # to satisfy supply-chain scanning. These mirror the SDK's runtime deps.
        run: python -m pip install "httpcore==1.0.9" "httpx==0.28.1" "pydantic==2.13.4"

      - name: Import every module from source (Python ${{ matrix.python-version }})
        # Imports the in-repo source directly (cwd is on sys.path) — no build or
        # install step, so there is no unpinned dependency resolution. Walking
        # every module forces each one to be imported, which is what surfaces a
        # missing-import / unregistered-model bug at definition time.
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import fastpix_python as root
          failed = []
          for mi in pkgutil.walk_packages(root.__path__, root.__name__ + '.'):
              try:
                  importlib.import_module(mi.name)
              except Exception as e:  # noqa: BLE001 - report every failure
                  failed.append(f"{mi.name}: {type(e).__name__}: {e}")
          if failed:
              print("IMPORT CHECK FAILED on Python", sys.version.split()[0])
              for item in failed:
                  print("  -", item)
              sys.exit(1)
          print("Import check passed on Python", sys.version.split()[0])
          PY
