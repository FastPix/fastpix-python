trigger:
- feature/*
pr:
- feature/*
resources:
- repo: self
variables:
  vmImageName: 'ubuntu-latest'
stages:
- stage: SonarCloudAnalysis
  displayName: SonarCloud Analysis Stage
  jobs:
  - job: Analyze
    displayName: Run SonarCloud Analysis
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: self
      fetchDepth: 0
    # NOSONAR - Azure DevOps task references support only the major version (@3);
    # a full semver (@3.x.y) is not valid syntax, so the version is left as-is.
    - task: SonarCloudPrepare@3 # NOSONAR
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'sdk_sonar'
        organization: 'fastpix'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'FastPix_python-language-sdk'
        cliProjectName: 'python-language-sdk'
        extraProperties: |
          sonar.projectKey=FastPix_python-language-sdk
          sonar.organization=fastpix
          sonar.projectName=python-language-sdk
          sonar.sources=.
          sonar.sourceEncoding=UTF-8
          # Test-only validator that shells out to python3 via spawnSync. Its
          # PATH-based command hotspot (S4036) is a Security Hotspot that NOSONAR
          # cannot suppress, so exclude this dev helper from analysis instead.
          # Does not affect runtime SDK code.
          sonar.exclusions=tests/validate-get-endpoints.ts
    - script: |
        echo "Running SonarCloud analysis for Python SDK"
      displayName: 'Build Step'
    - task: SonarCloudAnalyze@3 # NOSONAR
      displayName: 'Run SonarCloud Code Analysis'
    - task: SonarCloudPublish@3 # NOSONAR
      displayName: 'Publish SonarCloud Quality Gate Results'
      inputs:
        pollingTimeoutSec: '300'